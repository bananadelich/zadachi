<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c47d1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Журнал задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen app. Header with today's tally, scrolling list with a sticky capture field, bottom tabs; any task opens in a bottom sheet. */
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#f6f7fa; --ink:#141824; --muted:#5b6274; --faint:#8b92a3; --line:#e1e4eb;
  --accent:#2c47d1; --accent-ink:#ffffff; --accent-soft:#e6eafc;
  --new:#596071; --new-soft:#eceef3;
  --doing:#2c47d1; --doing-soft:#e6eafc;
  --wait:#9a5a00; --wait-soft:#fcefd6;
  --later:#6d50a8; --later-soft:#efe9f8;
  --done:#1b7a43; --done-soft:#ddf1e5;
  --cancel:#7d8496; --cancel-soft:#eceef2;
  --danger:#c2342a;
  --c-red:#d6383a; --c-red-soft:#fde5e3;
  --c-orange:#d9640f; --c-orange-soft:#fdeadb;
  --c-amber:#b08200; --c-amber-soft:#faf0cc;
  --c-green:#2a8540; --c-green-soft:#e0f2e4;
  --c-teal:#0d8783; --c-teal-soft:#d9f1f0;
  --c-blue:#2e6bdc; --c-blue-soft:#e2ecfd;
  --c-violet:#7a4fcf; --c-violet-soft:#eee7fb;
  --c-pink:#cc3d87; --c-pink-soft:#fbe3ef;
  --scrim:rgba(12,16,28,.45);
  --shadow:0 1px 2px rgba(20,28,50,.06),0 6px 20px rgba(20,28,50,.08);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --z:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e7e9f0; --muted:#9da4b5; --faint:#727a8c; --line:#2a303c;
    --accent:#7f95ff; --accent-ink:#0e1117; --accent-soft:#222a4c;
    --new:#a8aebb; --new-soft:#262b36;
    --doing:#7f95ff; --doing-soft:#222a4c;
    --wait:#f0b55c; --wait-soft:#3a2b12;
    --later:#b9a2f2; --later-soft:#2c2441;
    --done:#55c587; --done-soft:#163222;
    --cancel:#8c93a3; --cancel-soft:#252a33;
    --danger:#ff7b6f;
    --c-red:#ff7b72; --c-red-soft:#3d1d1c;
    --c-orange:#ff9b55; --c-orange-soft:#3b2414;
    --c-amber:#f0c547; --c-amber-soft:#352b10;
    --c-green:#62cf7c; --c-green-soft:#16301d;
    --c-teal:#4fd0ca; --c-teal-soft:#123130;
    --c-blue:#7eaaff; --c-blue-soft:#1a2a45;
    --c-violet:#b89eff; --c-violet-soft:#2a2142;
    --c-pink:#ff88c3; --c-pink-soft:#3d1a2d;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --surface-2:#1e232e; --ink:#e7e9f0; --muted:#9da4b5; --faint:#727a8c; --line:#2a303c;
  --accent:#7f95ff; --accent-ink:#0e1117; --accent-soft:#222a4c;
  --new:#a8aebb; --new-soft:#262b36;
  --doing:#7f95ff; --doing-soft:#222a4c;
  --wait:#f0b55c; --wait-soft:#3a2b12;
  --later:#b9a2f2; --later-soft:#2c2441;
  --done:#55c587; --done-soft:#163222;
  --cancel:#8c93a3; --cancel-soft:#252a33;
  --danger:#ff7b6f;
  --c-red:#ff7b72; --c-red-soft:#3d1d1c;
  --c-orange:#ff9b55; --c-orange-soft:#3b2414;
  --c-amber:#f0c547; --c-amber-soft:#352b10;
  --c-green:#62cf7c; --c-green-soft:#16301d;
  --c-teal:#4fd0ca; --c-teal-soft:#123130;
  --c-blue:#7eaaff; --c-blue-soft:#1a2a45;
  --c-violet:#b89eff; --c-violet-soft:#2a2142;
  --c-pink:#ff88c3; --c-pink-soft:#3d1a2d;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}

header.top{padding:14px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
.brand .date{color:var(--muted);font-size:14px;margin-top:3px}
.tally{display:flex;gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px 5px;min-width:64px}
.tile b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:11px;color:var(--muted);white-space:nowrap}
.tile.done b{color:var(--done)}
.tile.over b{color:var(--danger)}

.banner{margin:0 16px 8px;padding:8px 12px;border-radius:10px;background:var(--wait-soft);color:var(--wait);font-size:13px}
.banner[hidden]{display:none}

main{flex:1;overflow-y:auto;padding:0 16px 28px;-webkit-overflow-scrolling:touch}

.quick{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 10px}
.quick form{display:flex;gap:8px}
.field-big{flex:1;min-width:0;width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.field-big:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn-add{flex:none;height:48px;width:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.src-row{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;align-items:center}
.src-row::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.src-row .lbl{font-size:13px;color:var(--muted);flex:none;margin-right:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 4px}

.note{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:4px 0 10px}
.note button{border:0;background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--accent)}

.group{margin-top:16px}
.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px 2px;font-weight:600;display:flex;align-items:center;gap:8px}
.group h2 .gn{color:var(--faint);font-variant-numeric:tabular-nums}
.group h2 .grow{flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.row{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 12px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row.urgent::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--danger)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent;transition:border-color .15s,background .15s}
.check:hover{border-color:var(--done);color:var(--done)}
.row.is-done .check{background:var(--done);border-color:var(--done);color:var(--surface)}
.row.is-cancel .check{background:var(--cancel-soft);border-color:var(--cancel-soft);color:var(--cancel)}
.row-body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0 0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.is-cancel .row-title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--muted);row-gap:2px}
.meta span+span::before{content:"·";margin:0 7px;color:var(--faint)}
.meta .over{color:var(--danger);font-weight:500}
.meta .soon{color:var(--wait);font-weight:500}
.ex{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:2px;margin-left:4px}

.pill{flex:none;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap;line-height:1.3}
.st-new{color:var(--new);background:var(--new-soft)}
.st-doing{color:var(--doing);background:var(--doing-soft)}
.st-wait{color:var(--wait);background:var(--wait-soft)}
.st-later{color:var(--later);background:var(--later-soft)}
.st-done{color:var(--done);background:var(--done-soft)}
.st-cancel{color:var(--cancel);background:var(--cancel-soft)}
.row .pill{margin-top:2px}

.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.empty p{margin:0 auto;max-width:34ch}

.proj-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.proj{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.proj-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.proj-title{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.next{margin:10px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.next li::before{content:"";display:inline-block;width:10px;height:10px;border:1.5px solid var(--faint);border-radius:3px;margin-right:8px;vertical-align:-1px}

.summary{margin:4px 2px 0;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.copy{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;padding:2px 4px}
.tools-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.tools-box p{margin:0 0 10px}
.tools-box .more{margin:0}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-size:14px}

nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:17px;text-align:center;font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;background:var(--scrim);display:none;z-index:20;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);min-height:52px}
.sheet-head .kind{font-size:13px;color:var(--muted);font-weight:500}
.sheet-head .grow{flex:1;min-width:0}
.back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:500;padding:6px 4px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{flex:none;border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.sheet-body{overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:18px}
.sheet-body > *{flex-shrink:0}
.title-input{font-size:21px;font-weight:600;line-height:1.3;border:0;background:none;width:100%;padding:2px 0;resize:none;overflow:hidden}
.title-input:focus{outline:none}
.fl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:block;margin-bottom:7px}
.fl .n{font-variant-numeric:tabular-nums;color:var(--faint)}
.status-picker{display:flex;flex-wrap:wrap;gap:6px}
.status-picker button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.status-picker button[aria-pressed="false"]{background:var(--surface);color:var(--ink)}
.status-picker button[aria-pressed="true"]{border-color:currentColor;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:none;line-height:1.45;overflow:hidden}
select.inp{appearance:auto}
.inline{display:flex;gap:10px;align-items:flex-end}
.inline > div{flex:1;min-width:0}
.urgent-btn{flex:none;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 14px;font-size:15px;font-weight:500}
.urgent-btn[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.cl{display:flex;flex-direction:column}
.cl-item{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:44px}
.cl-item input[type=checkbox]{flex:none;width:20px;height:20px;accent-color:var(--done);margin:0}
.cl-item input[type=text]{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:8px 0}
.cl-item input[type=text]:focus{outline:none}
.cl-item.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.cl-item .icon-btn{width:34px;height:34px}
.cl-add{display:flex;gap:8px;margin-top:10px}
.btn-small{flex:none;height:44px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;padding:0 14px;font-size:15px}
.mini{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mini-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:15px}
.mini-row:first-child{border-top:0}
.mini-row span:last-child{overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:14px;margin:0}
.history{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.history{margin-bottom:6px}
.history li{display:flex;gap:10px}
.history time{flex:none;font-variant-numeric:tabular-nums;color:var(--ink);min-width:40px}
.history b{color:var(--ink);font-weight:600}
.hday{font-size:12px;font-weight:600;color:var(--ink);margin:10px 0 4px}
.danger-btn{align-self:flex-start;border:1px solid var(--line);background:none;color:var(--danger);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:500}
.danger-btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}

.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;display:flex;gap:16px;align-items:center;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
nav.tabs[hidden]{display:none}
.gate{text-align:center;padding:40px 8px;max-width:420px;margin:0 auto}
.gate h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 10px;text-wrap:balance}
.gate p{color:var(--muted);margin:0 0 18px}
.gate .err{color:var(--danger);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;text-align:left}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.arch-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:2px}
.arch-top .summary{margin:0}
.seg{display:flex;gap:4px}
.board{display:flex;gap:10px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 10px;scroll-snap-type:x proximity;scroll-padding:0 16px;align-items:flex-start}
.kcol{flex:0 0 min(78vw,272px);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.kcol.today{border-color:var(--done);box-shadow:inset 0 3px 0 var(--done)}
.khead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:2px 2px 4px}
.khead b{display:block;font-size:15px}
.khead span{font-size:12px;color:var(--muted)}
.khead .kcount{flex:none;min-width:26px;height:26px;border-radius:999px;background:var(--done-soft);color:var(--done);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 7px}
.kcards{display:flex;flex-direction:column;gap:8px}
.kcard{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 11px;box-shadow:0 1px 2px rgba(20,28,50,.05)}
.kcard.has-pc{box-shadow:inset 3px 0 0 var(--pc),0 1px 2px rgba(20,28,50,.05)}
.kmark{flex:none;width:20px;height:20px;border-radius:50%;background:var(--done);color:var(--surface);display:grid;place-items:center;margin-top:1px}
.kmark svg{width:12px;height:12px}
.kcard.is-cancel .kmark{background:var(--cancel-soft);color:var(--cancel)}
.kbody{min-width:0;flex:1;display:flex;flex-direction:column}
.ktitle{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.kcard.is-cancel .ktitle{text-decoration:line-through;color:var(--muted)}
.kcard .meta{font-size:12px}
.kcopy{align-self:flex-start}
.kmore{justify-content:center;background:none;border-style:dashed;min-height:120px}

/* project colors: --pc / --pcs are set inline from the project's color */
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);margin-right:7px;vertical-align:1px;flex:none}
.meta .ptag{font-style:normal;color:var(--pc);background:var(--pcs);border-radius:6px;padding:0 7px 0 6px;margin-right:8px;font-weight:600;display:inline-flex;align-items:center;max-width:100%}
.meta .ptag .pdot{width:7px;height:7px;margin-right:5px;vertical-align:0}
.pill.pc{color:var(--pc);background:var(--pcs)}
.proj{box-shadow:inset 5px 0 0 var(--pc);padding-left:19px}

.next li::before{border-color:var(--pc)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatch{width:34px;height:34px;border-radius:50%;border:0;background:var(--pc);color:var(--surface);display:grid;place-items:center;padding:0}
.swatch svg{opacity:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--pc)}

.sheet{overflow:hidden}
.sheet.has-pc .sheet-head{box-shadow:inset 0 4px 0 var(--pc)}

.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}
.viewbar{display:flex;justify-content:flex-end;margin:0 0 6px}
.kcard{display:flex;gap:9px;align-items:flex-start}
.kmark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;display:grid;place-items:center;margin-top:0;padding:0}
.kmark:hover{border-color:var(--done);color:var(--done)}
.kmark.on{background:var(--done);border-color:var(--done);color:var(--surface)}
.kcard.is-cancel .kmark{background:var(--cancel-soft);border-color:var(--cancel-soft);color:var(--cancel)}
.kbody{border:0;background:none;text-align:left;padding:0;min-width:0;flex:1;display:flex;flex-direction:column}
.kcard[draggable="true"]{cursor:grab}
.kcard.dragging{opacity:.45}
.kcol.drop{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.kbadges{display:flex;gap:4px;flex:none}
.khead .kcount.kc-cancel{background:var(--cancel-soft);color:var(--cancel)}
.kempty{margin:4px 2px;color:var(--faint);font-size:13px}
.khint{margin:6px 0 0}
.app{zoom:var(--z);height:calc(100% / var(--z))}
.sheet{zoom:var(--z);max-height:calc(94% / var(--z))}
@media (min-width:700px){.sheet{max-height:calc(88% / var(--z))}}
.toast{zoom:var(--z)}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Журнал задач</h1>
      <div class="date" id="head-date"></div>
    </div>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Задача"></div>
</div>
<div class="overlay" id="dlg" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Текст отчёта">
    <div class="sheet-head"><span class="kind grow">Выдели и скопируй текст</span><button class="icon-btn" type="button" data-act="dlg-close" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body"><textarea id="dlg-text" class="inp" readonly rows="10" style="min-height:220px;overflow:auto"></textarea></div>
  </div>
</div>
<div class="overlay" id="imp" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Перенос задач">
    <div class="sheet-head"><span class="kind grow">Вставь скопированные задачи</span><button class="icon-btn" type="button" data-act="imp-close" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      <label class="sr" for="imp-text">Текст с задачами</label>
      <textarea id="imp-text" class="inp" rows="8" style="min-height:200px;overflow:auto" placeholder="Вставь сюда текст, скопированный кнопкой «Скопировать все задачи»"></textarea>
      <p class="hint" id="imp-msg"></p>
      <button type="button" class="big-btn" data-act="imp-run">Перенести задачи</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<datalist id="src-list"></datalist>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== НАЧАЛО НАСТРОЕК: замени этот блок на тот, что скопировал из Firebase ====== */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* ====== КОНЕЦ НАСТРОЕК ====== */

(function(){
"use strict";

/* ---------- constants ---------- */
const STATUSES = [
  {id:'new',    label:'Не начато', group:'Не начато'},
  {id:'doing',  label:'В работе',  group:'В работе'},
  {id:'wait',   label:'Жду',       group:'Жду ответа или материалов'},
  {id:'later',  label:'Отложено',  group:'Отложено'},
  {id:'done',   label:'Готово',    group:'Готово'},
  {id:'cancel', label:'Отменено',  group:'Отменено'}
];
const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const ACTIVE = ['doing','new','wait','later'];
const CLOSED = ['done','cancel'];
const BASE_SOURCES = ['Руководитель','Сам'];
const COLORS = [
  {id:'blue', name:'Синий'}, {id:'orange', name:'Оранжевый'}, {id:'green', name:'Зелёный'}, {id:'violet', name:'Фиолетовый'},
  {id:'red', name:'Красный'}, {id:'teal', name:'Бирюзовый'}, {id:'amber', name:'Жёлтый'}, {id:'pink', name:'Розовый'}
];

const ICON = {
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  tasks:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg>',
  proj:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  archive:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/></svg>'
};

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const nowISO = () => new Date().toISOString();
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
const dayKeyISO = iso => keyOf(new Date(iso));
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => { const A = parseKey(a), B = parseKey(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const F = o => new Intl.DateTimeFormat('ru-RU', o);
const F_HEAD = F({weekday:'long', day:'numeric', month:'long'});
const F_DAY = F({weekday:'short', day:'numeric', month:'long'});
const F_DAY_Y = F({weekday:'short', day:'numeric', month:'long', year:'numeric'});
const F_LONG = F({day:'numeric', month:'long', year:'numeric'});
const F_SHORT = F({day:'numeric', month:'short'});
const F_TIME = F({hour:'2-digit', minute:'2-digit'});
const F_DT = F({day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
function plural(n, forms){ const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return forms[2]; if (b > 1 && b < 5) return forms[1]; if (b === 1) return forms[0]; return forms[2]; }
function lsGet(k){ try { return localStorage.getItem('journal.' + k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem('journal.' + k, v); } catch(e){} }
function dayTitle(k){
  const diff = daysBetween(k, todayKey()); const d = parseKey(k);
  const base = (d.getFullYear() === new Date().getFullYear() ? F_DAY : F_DAY_Y).format(d);
  if (diff === 0) return 'Сегодня, ' + base;
  if (diff === 1) return 'Вчера, ' + base;
  return cap(base);
}
function dueLabel(due){
  if (!due) return null;
  const diff = daysBetween(todayKey(), due);
  if (diff < 0) return {text:'просрочено на ' + (-diff) + ' ' + plural(-diff, ['день','дня','дней']), cls:'over'};
  if (diff === 0) return {text:'срок сегодня', cls:'soon'};
  if (diff === 1) return {text:'срок завтра', cls:'soon'};
  return {text:'до ' + F_SHORT.format(parseKey(due)), cls:''};
}
function autogrow(el){ if (!el) return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

function norm(t){
  const st = ST[t.status] ? t.status : 'new';
  return {
    id: t.id,
    title: String(t.title || ''),
    status: st,
    kind: t.kind === 'project' ? 'project' : 'task',
    source: String(t.source || ''),
    notes: String(t.notes || ''),
    due: typeof t.due === 'string' ? t.due : '',
    urgent: !!t.urgent,
    projectId: String(t.projectId || ''),
    checklist: Array.isArray(t.checklist) ? t.checklist.filter(x => x && typeof x === 'object').map((x, i) => ({id: String(x.id || ('i' + i)), text: String(x.text || ''), done: !!x.done})) : [],
    history: Array.isArray(t.history) ? t.history.filter(h => h && h.at) : [],
    createdAt: t.createdAt || nowISO(),
    updatedAt: t.updatedAt || '',
    closedAt: CLOSED.includes(st) ? (t.closedAt || t.updatedAt || t.createdAt || nowISO()) : null,
    color: String(t.color || ''),
    example: !!t.example
  };
}

/* ---------- state ---------- */
const state = {
  tasks: new Map(),
  loaded: false,
  tab: ['tasks','projects','archive'].includes(lsGet('tab')) ? lsGet('tab') : 'tasks',
  filter: 'all',
  src: lsGet('src') || '',
  openId: null,
  confirmDel: false,
  query: '',
  archiveDays: 21,
  archView: lsGet('archView') === 'list' ? 'list' : 'board',
  taskView: lsGet('taskView') === 'board' ? 'board' : 'list',
  scale: [0.8, 0.875, 1].includes(parseFloat(lsGet('scale'))) ? parseFloat(lsGet('scale')) : 0.875,
  deleted: new Set(),
  unsynced: new Set(),
  gate: 'loading',
  gateError: '',
  user: null
};

/* ---------- storage: Firebase ---------- */
let resolveStore; let storeReady = new Promise(r => resolveStore = r);
const fb = {auth: null};

function fbStore(db, uid){
  const col = collection(db, 'users', uid, 'tasks');
  const fire = pr => { pr.catch(writeError); return Promise.resolve(); };
  return {
    kind: 'firebase',
    subscribe(next, onErr){
      let confirmed = false;
      const timer = setTimeout(() => { if (!confirmed) showBanner('conn', 'Нет связи с базой. Задачи сохраняются на устройстве и отправятся, когда появится интернет.'); }, 10000);
      return onSnapshot(col, {includeMetadataChanges: true}, snap => {
        const map = new Map();
        snap.docs.forEach(d => map.set(d.id, Object.assign({}, d.data(), {id: d.id})));
        if (!snap.metadata.fromCache && !confirmed){ confirmed = true; clearTimeout(timer); hideBanner('conn'); }
        next(map, confirmed || map.size > 0);
      }, e => { clearTimeout(timer); onErr(e); });
    },
    set: (id, data) => fire(setDoc(doc(col, id), data)),
    update: (id, patch) => fire(updateDoc(doc(col, id), patch)),
    remove: id => fire(deleteDoc(doc(col, id)))
  };
}
function authErrorText(e){
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return 'Этот адрес не разрешён для входа. В Firebase открой Authentication → Settings → Authorized domains и добавь ' + location.hostname + '.';
  if (c === 'auth/operation-not-allowed') return 'Вход через Google не включён. В Firebase открой Authentication → Sign-in method и включи Google.';
  if (c === 'auth/network-request-failed') return 'Нет связи с Google. Проверь интернет или включи VPN.';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'Неверный apiKey в настройках. Скопируй блок firebaseConfig из Firebase заново.';
  return 'Не получилось войти (' + (c || 'неизвестная ошибка') + '). Попробуй ещё раз.';
}
async function login(){
  if (!fb.auth) return;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({prompt: 'select_account'});
  state.gateError = ''; renderMain();
  try { await signInWithPopup(fb.auth, provider); }
  catch(e){
    const c = (e && e.code) || '';
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment'){
      try { await signInWithRedirect(fb.auth, provider); } catch(e2){ state.gateError = authErrorText(e2); renderMain(); }
    } else if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request'){
      state.gateError = authErrorText(e); renderMain();
    }
  }
}
async function initStore(){
  if (!firebaseConfig.apiKey){ state.gate = 'config'; state.loaded = true; renderAll(); return; }
  let db;
  try {
    const app = initializeApp(firebaseConfig);
    fb.auth = getAuth(app);
    try { db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
    catch(e){ db = initializeFirestore(app, {}); }
  } catch(e){ state.gate = 'config'; state.gateError = 'Настройки Firebase не подходят: ' + (e && e.message ? e.message : e); state.loaded = true; renderAll(); return; }
  getRedirectResult(fb.auth).catch(e => { state.gateError = authErrorText(e); renderMain(); });
  let unsub = null;
  onAuthStateChanged(fb.auth, user => {
    if (unsub){ unsub(); unsub = null; }
    if (!user){
      if (state.user){ storeReady = new Promise(r => resolveStore = r); }
      state.user = null; state.gate = 'login'; state.loaded = true;
      state.tasks = new Map(); pend.clear(); state.unsynced.clear(); state.deleted.clear();
      closeSheet(true); renderAll(); return;
    }
    state.user = {email: user.email || '', name: user.displayName || ''};
    state.gate = ''; state.gateError = ''; state.loaded = false;
    const store = fbStore(db, user.uid);
    resolveStore(store);
    renderAll();
    unsub = store.subscribe(onData, e => {
      state.loaded = true;
      const c = e && e.code;
      showBanner('conn', c === 'permission-denied' ? 'База не пускает. Проверь правила Firestore (шаг 4 инструкции) и обнови страницу.' : 'Связь с базой прервалась. Обнови страницу.');
      renderAll();
    });
  });
}

/* writes: one at a time per task, edits coalesced */
var pend = new Map();
function pendOf(id){ let p = pend.get(id); if (!p){ p = {patch:{}, timer:null, chain:Promise.resolve()}; pend.set(id, p); } return p; }
function writeError(e){
  const code = e && e.code;
  if (code === 'permission-denied') toast('База не пускает: проверь правила Firestore (шаг 4 инструкции).');
  else if (code === 'resource-exhausted') toast('Бесплатный лимит Firebase на сегодня исчерпан. Завтра всё заработает снова.');
  else if (code === 'quota_exceeded') toast('Хранилище заполнено. Удали старые задачи из архива, чтобы записывать новые.');
  else if (code === 'revoked' || code === 'not_granted') toast('Нет доступа к хранилищу: изменения не сохранились.');
  else toast('Не удалось сохранить. Проверь связь и попробуй ещё раз.');
}
function patchTask(id, patch, delay){
  const t = state.tasks.get(id); if (!t) return;
  const stamp = {updatedAt: nowISO()};
  Object.assign(t, patch, stamp);
  const p = pendOf(id);
  Object.assign(p.patch, patch, stamp);
  clearTimeout(p.timer);
  p.timer = setTimeout(() => flush(id), delay == null ? 450 : delay);
  renderAll();
  if (state.openId === id){ const hb = $('#hist'); if (hb) hb.innerHTML = historyHTML(t); }
}
function flush(id){
  const p = pend.get(id); if (!p) return;
  clearTimeout(p.timer); p.timer = null;
  if (!Object.keys(p.patch).length) return;
  const patch = p.patch; p.patch = {};
  p.chain = p.chain.then(() => storeReady).then(s => s.update(id, patch)).catch(e => {
    if (state.deleted.has(id)) return;
    if (e && e.code === 'unavailable') return new Promise(r => setTimeout(r, 600 + Math.random() * 600)).then(() => storeReady).then(s => s.update(id, patch)).catch(writeError);
    writeError(e);
  });
}
function flushAll(){ for (const id of pend.keys()) flush(id); }
function createTask(fields){
  const id = rid(); const at = nowISO();
  const t = norm(Object.assign({status:'new', kind:'task'}, fields, {id, createdAt: at, updatedAt: at}));
  if (t.kind === 'project' && !t.color) t.color = nextColor();
  t.history = [{s:'created', at}];
  if (t.status !== 'new') t.history.push({s: t.status, at});
  state.tasks.set(id, t); state.unsynced.add(id);
  const body = Object.assign({}, t); delete body.id;
  const p = pendOf(id);
  p.chain = p.chain.then(() => storeReady).then(s => s.set(id, body)).then(() => state.unsynced.delete(id)).catch(e => { state.unsynced.delete(id); writeError(e); });
  renderAll();
  return id;
}
function deleteTask(id){
  const p = pend.get(id);
  if (p){ clearTimeout(p.timer); p.patch = {}; }
  state.deleted.add(id); state.unsynced.delete(id); state.tasks.delete(id);
  const chain = p ? p.chain : Promise.resolve();
  pend.delete(id);
  chain.then(() => storeReady).then(s => s.remove(id)).catch(writeError);
}
function onData(map, ready){
  const next = new Map();
  for (const [id, raw] of map){
    if (state.deleted.has(id)) continue;
    const p = pend.get(id);
    next.set(id, norm(p && Object.keys(p.patch).length ? Object.assign({}, raw, p.patch, {id}) : raw));
  }
  for (const id of Array.from(state.deleted)) if (!map.has(id)) state.deleted.delete(id);
  for (const id of state.unsynced) if (!next.has(id) && state.tasks.has(id)) next.set(id, state.tasks.get(id));
  state.tasks = next;
  if (ready) state.loaded = true;
  if (state.openId && !state.tasks.has(state.openId)) closeSheet(true);
  renderAll();
}

/* ---------- status ---------- */
function snapshotOf(t){ return {status:t.status, closedAt:t.closedAt, history:t.history.slice()}; }
function changeStatus(id, st){
  const t = state.tasks.get(id); if (!t || t.status === st) return;
  const at = nowISO();
  patchTask(id, {status: st, closedAt: CLOSED.includes(st) ? at : null, history: t.history.concat([{s: st, at}]).slice(-250)}, 0);
}
function toggleDone(id){
  const t = state.tasks.get(id); if (!t) return;
  const prev = snapshotOf(t);
  if (CLOSED.includes(t.status)){ changeStatus(id, 'doing'); toast('Возвращено в работу', 'Отменить', () => patchTask(id, prev, 0)); }
  else { changeStatus(id, 'done'); toast('Готово, задача в архиве', 'Отменить', () => patchTask(id, prev, 0)); }
}

/* ---------- derived ---------- */
const all = () => Array.from(state.tasks.values());
function sources(){
  const seen = new Set(BASE_SOURCES); const out = BASE_SOURCES.slice();
  all().sort((a, b) => (b.createdAt > a.createdAt ? 1 : -1)).forEach(t => { const s = t.source.trim(); if (s && !seen.has(s)){ seen.add(s); out.push(s); } });
  return out;
}
function cmpActive(a, b){
  if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  return a.createdAt > b.createdAt ? -1 : 1;
}
function projStats(p){
  const linked = all().filter(t => t.kind === 'task' && t.projectId === p.id && t.status !== 'cancel');
  const total = p.checklist.length + linked.length;
  const done = p.checklist.filter(c => c.done).length + linked.filter(t => t.status === 'done').length;
  return {total, done, linked};
}

function projColor(p){
  if (p && COLORS.some(c => c.id === p.color)) return p.color;
  let h = 0; const s = String((p && p.id) || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return COLORS[h % COLORS.length].id;
}
const pcStyle = id => '--pc:var(--c-' + id + ');--pcs:var(--c-' + id + '-soft)';
function nextColor(){
  const projs = all().filter(p => p.kind === 'project');
  const used = projs.filter(p => !CLOSED.includes(p.status)).map(projColor);
  const free = COLORS.find(c => !used.includes(c.id));
  return (free || COLORS[projs.length % COLORS.length]).id;
}

function projCard(p){
  const s = projStats(p); const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  const closed = CLOSED.includes(p.status);
  const meta = ['<span>' + (s.total ? s.done + ' из ' + s.total + ' готово' : 'пунктов пока нет') + '</span>'];
  if (p.source.trim()) meta.push('<span>' + esc(p.source.trim()) + '</span>');
  if (!closed){ const d = dueLabel(p.due); if (d) meta.push('<span class="' + d.cls + '">' + d.text + '</span>'); }
  const nextItems = closed ? [] : p.checklist.filter(c => !c.done && c.text.trim()).slice(0, 3);
  return '<button type="button" class="proj' + (closed ? ' closed' : '') + '" style="' + pcStyle(projColor(p)) + '" data-act="open" data-id="' + p.id + '">'
    + '<div class="proj-top"><span class="proj-title"><i class="pdot"></i>' + (esc(p.title) || 'Без названия') + (p.example ? '<span class="ex">пример</span>' : '') + '</span><span class="pill st-' + p.status + '">' + ST[p.status].label + '</span></div>'
    + '<div class="meta">' + meta.join('') + '</div>'
    + '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>'
    + (nextItems.length ? '<ul class="next">' + nextItems.map(c => '<li>' + esc(c.text) + '</li>').join('') + '</ul>' : '')
    + '</button>';
}

function runImport(){
  const msg = $('#imp-msg');
  let obj;
  try { obj = JSON.parse($('#imp-text').value.trim()); } catch(e){ msg.textContent = 'Это не похоже на скопированные задачи. Скопируй их заново кнопкой «Скопировать все задачи» и вставь целиком.'; return; }
  const list = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.tasks) ? obj.tasks : null);
  if (!list){ msg.textContent = 'В тексте не нашлось задач.'; return; }
  let added = 0, skipped = 0;
  list.forEach(raw => {
    if (!raw || typeof raw !== 'object') return;
    const id = String(raw.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60) || rid();
    if (state.tasks.has(id)){ skipped++; return; }
    const t = norm(Object.assign({}, raw, {id}));
    const body = Object.assign({}, t); delete body.id;
    state.tasks.set(id, t); state.unsynced.add(id);
    const p = pendOf(id);
    p.chain = p.chain.then(() => storeReady).then(st => st.set(id, body)).then(() => state.unsynced.delete(id)).catch(e => { state.unsynced.delete(id); writeError(e); });
    added++;
  });
  const d = $('#imp'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true');
  $('#imp-text').value = ''; msg.textContent = '';
  renderAll();
  toast('Перенесено задач: ' + added + (skipped ? ', уже были: ' + skipped : ''));
}
function cardHTML(t, mode){
  const closed = CLOSED.includes(t.status), cancel = t.status === 'cancel';
  const pr = t.kind === 'project' ? t : (t.projectId && state.tasks.get(t.projectId));
  const meta = [];
  if (closed && t.closedAt) meta.push('<span>' + (mode === 'arch' || dayKeyISO(t.closedAt) === todayKey() ? F_TIME.format(new Date(t.closedAt)) : F_SHORT.format(new Date(t.closedAt))) + '</span>');
  if (t.source.trim()) meta.push('<span>' + esc(t.source.trim()) + '</span>');
  if (!closed){ const d = dueLabel(t.due); if (d) meta.push('<span class="' + d.cls + '">' + d.text + '</span>'); }
  if (t.urgent && !closed) meta.push('<span class="over">срочно</span>');
  if (t.checklist.length) meta.push('<span>пункты ' + t.checklist.filter(c => c.done).length + '/' + t.checklist.length + '</span>');
  if (mode === 'board' && !closed && t.notes.trim()) meta.push('<span>есть нюансы</span>');
  if (cancel) meta.push('<span>отменено</span>');
  const chip = t.kind === 'project' ? '<em class="ptag" style="' + pcStyle(projColor(t)) + '"><i class="pdot"></i>проект</em>'
    : (pr ? '<em class="ptag" style="' + pcStyle(projColor(pr)) + '"><i class="pdot"></i>' + esc(pr.title || 'Проект') + '</em>' : '');
  return '<div class="kcard' + (cancel ? ' is-cancel' : '') + (pr ? ' has-pc' : '') + '"' + (pr ? ' style="' + pcStyle(projColor(pr)) + '"' : '') + (mode === 'board' ? ' draggable="true"' : '') + ' data-id="' + t.id + '">'
    + '<button type="button" class="kmark' + (closed ? ' on' : '') + '" data-act="toggle" data-id="' + t.id + '" aria-label="' + (closed ? 'Вернуть в работу' : 'Отметить выполненной') + '">' + (cancel ? ICON.x : ICON.check) + '</button>'
    + '<button type="button" class="kbody" data-act="open" data-id="' + t.id + '"><span class="ktitle">' + (esc(t.title) || 'Без названия') + '</span>'
    + (meta.length || chip ? '<span class="meta">' + chip + meta.join('') + '</span>' : '') + '</button></div>';
}
function taskBoardHTML(){
  const tasks = all().filter(t => t.kind === 'task'); const tk = todayKey();
  let h = '<div class="board">';
  ['doing','new','wait','later','done','cancel'].forEach(s => {
    let g = tasks.filter(t => t.status === s); let more = 0;
    const isClosed = CLOSED.includes(s);
    if (isClosed){
      g = g.filter(t => t.closedAt && daysBetween(dayKeyISO(t.closedAt), tk) < 7).sort((a, b) => a.closedAt > b.closedAt ? -1 : 1);
      if (g.length > 15){ more = g.length - 15; g = g.slice(0, 15); }
    } else g.sort(cmpActive);
    h += '<section class="kcol" data-st="' + s + '"><header class="khead"><div><b><i class="kdot" style="background:var(--' + s + ')"></i>' + ST[s].label + '</b>' + (isClosed ? '<span>за 7 дней</span>' : '') + '</div><span class="kcount" style="background:var(--' + s + '-soft);color:var(--' + s + ')">' + (g.length + more) + '</span></header>'
      + '<div class="kcards">' + (g.map(t => cardHTML(t, 'board')).join('') || '<p class="kempty">Пусто</p>') + '</div>'
      + (isClosed ? '<button type="button" class="copy kcopy" data-act="tab" data-tab="archive">Весь архив →</button>' : '') + '</section>';
  });
  return h + '</div><p class="hint khint">На компьютере карточки можно перетаскивать между колонками. На телефоне нажми на карточку и выбери статус.</p>';
}

  return '<div class="seg" role="group" aria-label="Вид"><button type="button" class="chip" data-act="' + act + '" data-v="list" aria-pressed="' + (cur === 'list') + '">Список</button><button type="button" class="chip" data-act="' + act + '" data-v="board" aria-pressed="' + (cur === 'board') + '">Доска</button></div>';

function viewHTML(){
  const opts = [[0.8, 'Мелкий'], [0.875, 'Средний'], [1, 'Крупный']];
  return '<section class="group"><h2>Размер интерфейса</h2><div class="tools-box"><div class="seg">' + opts.map(([z, l]) => '<button type="button" class="chip" data-act="scale" data-z="' + z + '" aria-pressed="' + (state.scale === z) + '">' + l + '</button>').join('') + '</div></div></section>';

function applyScale(){ document.documentElement.style.setProperty('--z', String(state.scale)); }
function boardHTML(keys, byDay){
  let h = '<div class="board">';
  keys.slice(0, state.archiveDays).forEach(k => {
    const g = byDay.get(k).sort((a, b) => a.closedAt > b.closedAt ? -1 : 1);
    const nDone = g.filter(t => t.status === 'done').length;
    const diff = daysBetween(k, todayKey()); const d = parseKey(k);
    const big = diff === 0 ? 'Сегодня' : diff === 1 ? 'Вчера' : cap(F({weekday:'long'}).format(d));
    h += '<section class="kcol' + (diff === 0 ? ' today' : '') + '"><header class="khead"><div><b>' + big + '</b><span>' + F_LONG.format(d) + '</span></div><span class="kbadges"><span class="kcount">' + nDone + '</span>' + (g.length - nDone ? '<span class="kcount kc-cancel" title="отменено">' + (g.length - nDone) + '</span>' : '') + '</span></header>'
      + '<div class="kcards">' + g.map(t => cardHTML(t, 'arch')).join('') + '</div>'
      + '<button type="button" class="copy kcopy" data-act="copy-day" data-day="' + k + '">Скопировать отчёт</button>' + '</section>';
  });
  if (keys.length > state.archiveDays) h += '<section class="kcol kmore"><button type="button" class="more" data-act="more-archive">Показать более ранние дни</button></section>';
  return h + '</div>';
}
function archiveHTML(){ return archiveListHTML() + viewHTML() + toolsHTML(); }
function archiveListHTML(){
  const q = state.query.trim().toLowerCase();
  const closedAll = all().filter(t => CLOSED.includes(t.status) && t.closedAt);
  let items = closedAll;
  if (q) items = items.filter(t => (t.title + ' ' + t.notes + ' ' + t.source + ' ' + t.checklist.map(c => c.text).join(' ')).toLowerCase().includes(q));
  const tk = todayKey();
  const doneAll = closedAll.filter(t => t.status === 'done');
  const w = doneAll.filter(t => daysBetween(dayKeyISO(t.closedAt), tk) < 7).length;
  const m = doneAll.filter(t => daysBetween(dayKeyISO(t.closedAt), tk) < 30).length;
  const cw = closedAll.filter(t => t.status === 'cancel' && daysBetween(dayKeyISO(t.closedAt), tk) < 7).length;
  let h = '<div class="arch-top"><p class="summary">За 7 дней выполнено: <b>' + w + '</b>' + (cw ? ', отменено: <b>' + cw + '</b>' : '') + ' · за 30 дней: <b>' + m + '</b></p>' + viewbar('arch-view', state.archView) + '</div>';
  if (!items.length) return h + emptyHTML(q ? 'Ничего не найдено' : 'Архив пока пуст', q ? 'Попробуй другое слово.' : 'Отмечай задачи выполненными, и они будут собираться здесь по дням.');
  const byDay = new Map();
  items.forEach(t => { const k = dayKeyISO(t.closedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(t); });
  const keys = Array.from(byDay.keys()).sort().reverse();
  if (state.archView === 'board') return h + boardHTML(keys, byDay);
  keys.slice(0, state.archiveDays).forEach(k => {
    const g = byDay.get(k).sort((a, b) => a.closedAt > b.closedAt ? -1 : 1);
    const nDone = g.filter(t => t.status === 'done').length;
    h += '<section class="group"><h2><span>' + dayTitle(k) + '</span><span class="gn">' + nDone + '</span><span class="grow"></span>' + (nDone ? '<button type="button" class="copy" data-act="copy-day" data-day="' + k + '">Скопировать отчёт</button>' : '') + '</h2><div class="list">' + g.map(t => rowHTML(t, {time: true, pill: t.status === 'cancel'})).join('') + '</div></section>';
  });
  if (keys.length > state.archiveDays) h += '<button type="button" class="more" data-act="more-archive">Показать более ранние дни</button>';
  return h;
}

/* ---------- sheet ---------- */
function histText(h){
  const v = h.v ? esc(h.v) : '';
  if (h.s === 'created') return 'Записано';
  if (h.s !== 'edit') return 'Статус: <b>' + (ST[h.s] ? ST[h.s].label : esc(h.s)) + '</b>';
  switch (h.f){
    case 'title': return 'Название: «' + v + '»';
    case 'source': return v ? 'От кого: ' + v : 'Убрано «от кого»';
    case 'due': return h.v ? 'Срок: ' + F_SHORT.format(parseKey(h.v)) : 'Срок убран';
    case 'urgent': return h.v ? 'Отмечено как срочное' : 'Снята отметка «Срочно»';
    case 'project': return v ? 'Проект: ' + v : 'Убрано из проекта';
    case 'notes': return 'Изменены нюансы';
    case 'cl-add': return 'Пункт добавлен: ' + v;
    case 'cl-done': return 'Пункт выполнен: ' + v;
    case 'cl-undo': return 'Пункт снова не выполнен: ' + v;
    case 'cl-del': return 'Пункт удалён: ' + v;
    case 'cl-edit': return 'Пункт изменён: ' + v;
    case 'color': return 'Изменён цвет проекта';
    case 'task-add': return 'Задача добавлена в проект: ' + v;
    default: return 'Изменено';
  }
}
function historyHTML(t){
  const items = t.history.slice().sort((a, b) => a.at < b.at ? 1 : -1);
  if (!items.length) return '<p class="hint">Записано ' + F_DT.format(new Date(t.createdAt)) + '</p>';
  const last = items[0].at;
  let h = '<p class="hint">Записано ' + F_DT.format(new Date(t.createdAt)) + ' · последнее изменение ' + F_DT.format(new Date(last)) + '</p>';
  let day = '';
  items.forEach(it => {
    const k = dayKeyISO(it.at);
    if (k !== day){ if (day) h += '</ul>'; day = k; h += '<div class="hday">' + dayTitle(k) + '</div><ul class="history">'; }
    h += '<li><time>' + F_TIME.format(new Date(it.at)) + '</time><span>' + histText(it) + '</span></li>';
  });
  return h + '</ul>';
}
function hist(t, e, merge){
  const at = nowISO(); const h = t.history.slice(); const last = h[h.length - 1];
  if (e.v != null) e.v = String(e.v).slice(0, 90);
  if (merge && last && last.s === 'edit' && last.f === e.f && (last.k || '') === (e.k || '') && Date.parse(at) - Date.parse(last.at) < 600000) h[h.length - 1] = Object.assign({}, last, e, {s: 'edit', at});
  else h.push(Object.assign({s: 'edit', at}, e));
  return h.slice(-250);
}
let lastSheetSig = '';
function renderSheet(force){
  if (!state.openId) return;
  const sheet = $('#sheet');
  if (!force && sheet.contains(document.activeElement) && document.activeElement !== sheet) return;
  const t = state.tasks.get(state.openId); if (!t) return;
  const body0 = $('.sheet-body', sheet); const scroll = body0 ? body0.scrollTop : 0;
  const isProj = t.kind === 'project';
  const parent = !isProj && t.projectId && state.tasks.get(t.projectId);
  const projects = all().filter(p => p.kind === 'project' && (!CLOSED.includes(p.status) || p.id === t.projectId));
  const clDone = t.checklist.filter(c => c.done).length;
  const linkedSig = isProj ? all().filter(x => x.projectId === t.id).map(x => x.id + x.status + x.title).join('|') : '';
  const sig = JSON.stringify([t, state.confirmDel, linkedSig, projects.map(p => p.id + p.title).join('|'), parent ? parent.title + projColor(parent) : '']);
  if (!force && sig === lastSheetSig) return;
  lastSheetSig = sig;
  const pcol = isProj ? projColor(t) : parent ? projColor(parent) : '';
  let h = '<div class="sheet-head">'
    + (parent ? '<button type="button" class="back" data-act="open" data-id="' + parent.id + '">←<i class="pdot"></i>' + esc(parent.title || 'Проект') + '</button><span class="grow"></span>' : '<span class="kind grow">' + (isProj ? '<i class="pdot"></i>Проект' : 'Задача') + ' · записано ' + F_SHORT.format(new Date(t.createdAt)) + '</span>')
    + '<button type="button" class="icon-btn" data-act="close" aria-label="Закрыть">' + ICON.close + '</button></div>'
    + '<div class="sheet-body">'
    + '<label class="sr" for="f-title">Название</label><textarea id="f-title" class="title-input" rows="1" placeholder="Название">' + esc(t.title) + '</textarea>'
    + (isProj ? '<div><span class="fl">Цвет проекта</span><div class="swatches" role="group" aria-label="Цвет проекта">' + COLORS.map(c => '<button type="button" class="swatch" data-act="pcolor" data-color="' + c.id + '" style="' + pcStyle(c.id) + '" aria-pressed="' + (pcol === c.id) + '" aria-label="' + c.name + '">' + ICON.check + '</button>').join('') + '</div></div>' : '')
    + '<div><span class="fl">Статус</span><div class="status-picker" role="group" aria-label="Статус">' + STATUSES.map(s => '<button type="button" class="st-' + s.id + '" data-act="status" data-st="' + s.id + '" aria-pressed="' + (t.status === s.id) + '">' + s.label + '</button>').join('') + '</div></div>'
    + '<div class="grid2"><div><label class="fl" for="f-src">От кого</label><input id="f-src" class="inp" list="src-list" autocomplete="off" value="' + esc(t.source) + '" placeholder="Руководитель"></div>'
    + '<div><label class="fl" for="f-due">Срок</label><input id="f-due" type="date" class="inp" value="' + esc(t.due) + '"></div></div>'
    + '<div class="inline">'
    + (!isProj ? '<div><label class="fl" for="f-proj">Проект</label><select id="f-proj" class="inp"><option value="">Без проекта</option>' + projects.map(p => '<option value="' + p.id + '"' + (p.id === t.projectId ? ' selected' : '') + '>' + esc(p.title || 'Без названия') + '</option>').join('') + '</select></div>' : '<div></div>')
    + '<button type="button" class="urgent-btn" data-act="urgent" aria-pressed="' + t.urgent + '">Срочно</button></div>'
    + '<div><label class="fl" for="f-notes">Нюансы</label><textarea id="f-notes" class="inp" placeholder="Детали, договорённости, контакты, что уточнить">' + esc(t.notes) + '</textarea></div>'
    + '<div><span class="fl">' + (isProj ? 'Что входит в проект' : 'Пункты') + ' <span class="n">' + (t.checklist.length ? clDone + '/' + t.checklist.length : '') + '</span></span><div class="cl">'
    + t.checklist.map(c => '<div class="cl-item' + (c.done ? ' done' : '') + '"><input type="checkbox" id="cl-' + esc(c.id) + '" data-cl-check="' + esc(c.id) + '"' + (c.done ? ' checked' : '') + ' aria-label="Выполнено"><input type="text" data-cl-text="' + esc(c.id) + '" value="' + esc(c.text) + '" aria-label="Текст пункта"><button type="button" class="icon-btn" data-act="cl-del" data-cl="' + esc(c.id) + '" aria-label="Удалить пункт">' + ICON.x + '</button></div>').join('')
    + '</div><form class="cl-add" data-form="cl-add" autocomplete="off"><label class="sr" for="f-cl-new">Новый пункт</label><input id="f-cl-new" class="inp" enterkeyhint="done" placeholder="' + (isProj ? 'Например: заказать буклеты' : 'Добавить пункт') + '"><button class="btn-small" type="submit">Добавить</button></form></div>';
  if (isProj){
    const s = projStats(t);
    const linked = s.linked.slice().sort((a, b) => (CLOSED.includes(a.status) - CLOSED.includes(b.status)) || (a.createdAt > b.createdAt ? 1 : -1));
    h += '<div><span class="fl">Задачи проекта <span class="n">' + (linked.length ? linked.filter(x => x.status === 'done').length + '/' + linked.length : '') + '</span></span>'
      + (linked.length ? '<div class="mini">' + linked.map(x => '<button type="button" class="mini-row" data-act="open" data-id="' + x.id + '"><span class="pill st-' + x.status + '">' + ST[x.status].label + '</span><span>' + esc(x.title || 'Без названия') + '</span></button>').join('') + '</div>' : '<p class="hint">Пункты выше — для мелочей. Если у части проекта есть свой срок и статус, сделай её задачей проекта.</p>')
      + '<form class="cl-add" data-form="ptask" autocomplete="off"><label class="sr" for="f-ptask">Новая задача проекта</label><input id="f-ptask" class="inp" enterkeyhint="done" placeholder="Новая задача проекта"><button class="btn-small" type="submit">Добавить</button></form></div>';
  }
  h += '<div><span class="fl">История изменений</span><div id="hist">' + historyHTML(t) + '</div></div>'
    + '<button type="button" class="danger-btn' + (state.confirmDel ? ' armed' : '') + '" data-act="delete">' + (state.confirmDel ? 'Нажми ещё раз, чтобы удалить' : 'Удалить ' + (isProj ? 'проект' : 'задачу')) + '</button>'
    + '</div>';
  sheet.innerHTML = h;
  sheet.setAttribute('aria-label', isProj ? 'Проект' : 'Задача');
  sheet.classList.toggle('has-pc', !!pcol);
  sheet.style.cssText = pcol ? pcStyle(pcol) : '';
  autogrow($('#f-title')); autogrow($('#f-notes'));
  const body1 = $('.sheet-body', sheet); if (body1) body1.scrollTop = scroll;
}
function openSheet(id){
  if (state.openId && state.openId !== id) flush(state.openId);
  state.openId = id; state.confirmDel = false;
  const ov = $('#overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden', 'false');
  renderSheet(true);
  const b = $('.sheet-body'); if (b) b.scrollTop = 0;
}
function closeSheet(silent){
  if (state.openId) flush(state.openId);
  state.openId = null; state.confirmDel = false;
  const ov = $('#overlay'); ov.classList.remove('open'); ov.setAttribute('aria-hidden', 'true');
  $('#sheet').innerHTML = '';
  if (!silent) renderAll();
}

/* ---------- banner / toast / dialog ---------- */
const banners = {};
function showBanner(key, text){ banners[key] = text; paintBanner(); }
function hideBanner(key){ delete banners[key]; paintBanner(); }
function paintBanner(){ const el = $('#banner'); const t = Object.values(banners); el.hidden = !t.length; el.textContent = t.join(' '); }
let toastTimer;
function toast(msg, actLabel, fn){
  const el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (actLabel ? '<button type="button" id="toast-act">' + esc(actLabel) + '</button>' : '');
  el.hidden = false;
  if (actLabel) $('#toast-act').onclick = () => { el.hidden = true; fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}
function showText(text){
  const d = $('#dlg'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
  const ta = $('#dlg-text'); ta.value = text; ta.focus(); ta.select();
}
async function exportAll(){
  const tasks = all().filter(t => !t.example);
  const text = JSON.stringify({app: 'zhurnal-zadach', v: 1, exportedAt: nowISO(), tasks: tasks});
  try { await navigator.clipboard.writeText(text); toast('Скопировано задач: ' + tasks.length); }
  catch(e){ showText(text); }
}
async function copyDay(k){
  const day = all().filter(t => CLOSED.includes(t.status) && t.closedAt && dayKeyISO(t.closedAt) === k).sort((a, b) => a.closedAt > b.closedAt ? 1 : -1);
  const line = (t, i) => (i + 1) + '. ' + t.title.trim() + (t.source.trim() ? ' (' + t.source.trim() + ')' : '');
  const done = day.filter(t => t.status === 'done'), canc = day.filter(t => t.status === 'cancel');
  let text = F_LONG.format(parseKey(k)) + ', выполнено ' + done.length + ':\n' + done.map(line).join('\n');
  if (canc.length) text += '\n\nОтменено ' + canc.length + ':\n' + canc.map(line).join('\n');
  try { await navigator.clipboard.writeText(text); toast('Отчёт за день скопирован'); }
  catch(e){ showText(text); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b){
    if (e.target.id === 'overlay') closeSheet();
    if (e.target.id === 'imp'){ const d = $('#imp'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
    if (e.target.id === 'dlg'){ const d = $('#dlg'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
    return;
  }
  const act = b.dataset.act, id = b.dataset.id, cur = state.openId && state.tasks.get(state.openId);
  switch (act){
    case 'tab': state.tab = b.dataset.tab; lsSet('tab', state.tab); renderMain(); renderNav(); break;
    case 'filter': state.filter = b.dataset.f; renderMain(); break;
    case 'src': state.src = state.src === b.dataset.src ? '' : b.dataset.src; lsSet('src', state.src); renderSrcRow(); break;
    case 'open': openSheet(id); break;
    case 'toggle': toggleDone(id); break;
    case 'close': closeSheet(); break;
    case 'status': if (cur){ changeStatus(cur.id, b.dataset.st); renderSheet(true); } break;
    case 'pcolor': if (cur && cur.kind === 'project'){ patchTask(cur.id, {color: b.dataset.color, history: hist(cur, {f: 'color'}, true)}, 0); renderSheet(true); } break;
    case 'urgent': if (cur){ patchTask(cur.id, {urgent: !cur.urgent, history: hist(cur, {f: 'urgent', v: cur.urgent ? '' : '1'})}, 0); renderSheet(true); } break;
    case 'cl-del': if (cur){ { const it = cur.checklist.find(c => c.id === b.dataset.cl); patchTask(cur.id, {checklist: cur.checklist.filter(c => c.id !== b.dataset.cl), history: hist(cur, {f: 'cl-del', v: it ? it.text : ''})}, 0); } renderSheet(true); } break;
    case 'delete':
      if (!cur) break;
      if (!state.confirmDel){ state.confirmDel = true; renderSheet(true); setTimeout(() => { if (state.confirmDel){ state.confirmDel = false; const ae = document.activeElement; if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('#sheet').contains(ae))) renderSheet(true); } }, 4000); }
      else {
        const tid = cur.id, isProj = cur.kind === 'project';
        if (isProj) all().filter(t => t.projectId === tid).forEach(t => patchTask(t.id, {projectId: ''}, 0));
        closeSheet(true); deleteTask(tid); renderAll(); toast(isProj ? 'Проект удалён' : 'Задача удалена');
      }
      break;
    case 'copy-day': copyDay(b.dataset.day); break;
    case 'export': exportAll(); break;
    case 'login': login(); break;
    case 'logout': if (fb.auth) signOut(fb.auth); break;
    case 'import': { const d = $('#imp'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); $('#imp-msg').textContent = ''; $('#imp-text').focus(); break; }
    case 'imp-close': { const d = $('#imp'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); break; }
    case 'imp-run': runImport(); break;
    case 'task-view': state.taskView = b.dataset.v; lsSet('taskView', state.taskView); renderMain(); break;
    case 'scale': state.scale = parseFloat(b.dataset.z); lsSet('scale', String(state.scale)); applyScale(); renderMain(); break;
    case 'arch-view': state.archView = b.dataset.v; lsSet('archView', state.archView); renderMain(); break;
    case 'more-archive': state.archiveDays += 30; renderMain(); break;
    case 'clear-examples': all().filter(t => t.example).forEach(t => deleteTask(t.id)); renderAll(); toast('Примеры удалены'); break;
    case 'dlg-close': { const d = $('#dlg'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); break; }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'quick'){
    const inp = $('#q-input'); const title = inp.value.trim(); if (!title) return;
    createTask({title, kind:'task', source: state.src}); inp.value = ''; inp.focus();
    if (state.filter !== 'all' && state.filter !== 'new'){ state.filter = 'all'; renderMain(); }
  } else if (f === 'proj'){
    const inp = $('#p-input'); const title = inp.value.trim(); if (!title) return;
    const id = createTask({title, kind:'project', status:'doing'}); inp.value = ''; inp.blur(); openSheet(id);
  } else if (f === 'cl-add'){
    const cur = state.tasks.get(state.openId); const inp = $('#f-cl-new'); const text = inp.value.trim(); if (!cur || !text) return;
    patchTask(cur.id, {checklist: cur.checklist.concat([{id: rid(), text, done: false}]), history: hist(cur, {f: 'cl-add', v: text})}, 0);
    renderSheet(true); const n = $('#f-cl-new'); if (n) n.focus();
  } else if (f === 'ptask'){
    const cur = state.tasks.get(state.openId); const inp = $('#f-ptask'); const title = inp.value.trim(); if (!cur || !title) return;
    createTask({title, kind:'task', projectId: cur.id, source: cur.source});
    patchTask(cur.id, {history: hist(cur, {f: 'task-add', v: title})}, 0);
    renderSheet(true); const n = $('#f-ptask'); if (n) n.focus();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'arch-q'){ state.query = el.value; $('#dyn').innerHTML = archiveHTML(); return; }
  const cur = state.openId && state.tasks.get(state.openId); if (!cur || !$('#sheet').contains(el)) return;
  if (el.id === 'f-title'){ autogrow(el); const v = el.value.replace(/\n/g, ' '); patchTask(cur.id, {title: v, history: hist(cur, {f: 'title', v: v}, true)}); }
  else if (el.id === 'f-src') patchTask(cur.id, {source: el.value, history: hist(cur, {f: 'source', v: el.value.trim()}, true)});
  else if (el.id === 'f-notes'){ autogrow(el); patchTask(cur.id, {notes: el.value, history: hist(cur, {f: 'notes'}, true)}); }
  else if (el.dataset.clText){ const cid = el.dataset.clText; patchTask(cur.id, {checklist: cur.checklist.map(c => c.id === cid ? {id: c.id, text: el.value, done: c.done} : c), history: hist(cur, {f: 'cl-edit', k: cid, v: el.value}, true)}); }
});
document.addEventListener('change', e => {
  const el = e.target;
  const cur = state.openId && state.tasks.get(state.openId); if (!cur || !$('#sheet').contains(el)) return;
  if (el.id === 'f-due') patchTask(cur.id, {due: el.value || '', history: hist(cur, {f: 'due', v: el.value || ''}, true)}, 0);
  else if (el.id === 'f-proj'){
    const pr = el.value && state.tasks.get(el.value);
    patchTask(cur.id, {projectId: el.value, history: hist(cur, {f: 'project', v: pr ? pr.title : ''})}, 0);
    if (pr) patchTask(pr.id, {history: hist(pr, {f: 'task-add', v: cur.title})}, 0);
  }
  else if (el.dataset.clCheck){ const cid = el.dataset.clCheck; const it = cur.checklist.find(c => c.id === cid); patchTask(cur.id, {checklist: cur.checklist.map(c => c.id === cid ? {id: c.id, text: c.text, done: el.checked} : c), history: hist(cur, {f: el.checked ? 'cl-done' : 'cl-undo', v: it ? it.text : ''})}, 0); renderSheet(true); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('#dlg').classList.contains('open')){ $('#dlg').classList.remove('open'); return; }
    if (state.openId) closeSheet();
  }
  if (e.key === 'Enter' && e.target.id === 'f-title'){ e.preventDefault(); e.target.blur(); }
});
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else renderAll(); });

document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard[draggable="true"]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
document.addEventListener('dragend', () => { document.querySelectorAll('.dragging, .kcol.drop').forEach(x => x.classList.remove('dragging', 'drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.kcol[data-st]'); if (!col) return; e.preventDefault(); document.querySelectorAll('.kcol.drop').forEach(x => { if (x !== col) x.classList.remove('drop'); }); col.classList.add('drop'); });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.kcol[data-st]'); if (!col) return; e.preventDefault(); col.classList.remove('drop');
  const id = e.dataTransfer.getData('text/plain'); const t = state.tasks.get(id); const st = col.dataset.st;
  if (!t || t.status === st) return;
  const prev = snapshotOf(t); changeStatus(id, st); toast('Статус: ' + ST[st].label, 'Отменить', () => patchTask(id, prev, 0));
});

applyScale();
renderAll();
initStore();
})();
</script>
